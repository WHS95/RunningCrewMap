:root {
  --bg: #ffffff;

@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {

:root[data-theme="dark"] {
  --bg: #0d0d0d; --ink: #f2f2f2; --soft: #cfcfcf; --line: #333333; --mark: #ff4d42; color-scheme: dark }

body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 20px; line-height: 1.65; word-break: keep-all; overflow-wrap: anywhere; }
.wrap { max-width: 560px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-top: 36px; padding-bottom: calc(var(--bar-h) + 56px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 64px; }
h1, h2, h3 { text-wrap: balance; margin: 0; line-height: 1.35; font-weight: 900; }
h1 { font-size: 30px; letter-spacing: -0.5px; }
h2 { font-size: 26px; letter-spacing: -0.4px; }
h3 { font-size: 22px; font-weight: 700; }
p { margin: 0; }
a { color: inherit; text-underline-offset: 4px; }
b.mark, .mark { color: var(--mark); font-weight: 700; }
section { display: flex; flex-direction: column; gap: 18px; scroll-margin-top: 12px; }
.tag { align-self: flex-start; font-size: 18px; font-weight: 900; border: 2px solid var(--ink); border-radius: 999px; padding: 2px 14px; }

/* 처음 고르는 칸 */
.choose { display: flex; flex-direction: column; gap: 12px; }
.choose a { display: flex; align-items: center; justify-content: space-between; gap: 12px; text-decoration: none; border: 2px solid var(--ink); border-radius: 14px; padding: 18px 20px; min-height: 64px; box-sizing: border-box; }
.choose b { font-size: 22px; }
.choose span { font-size: 17px; color: var(--soft); text-align: right; flex: none; }
.choose a:focus-visible, .next:focus-visible, .bar:focus-visible { outline: 3px solid var(--mark); outline-offset: 3px; }

/* 단계 */
.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.step { padding: 28px 0; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 16px; }
.step:last-child { border-bottom: 1px solid var(--line); }
.step-head { display: flex; gap: 14px; align-items: flex-start; }
.num { flex: none; width: 40px; height: 40px; border-radius: 50%; background: var(--ink); color: var(--bg); font-weight: 900; font-size: 22px; display: flex; align-items: center; justify-content: center; font-variant-numeric: tabular-nums; }
.step-head div { min-width: 0; display: flex; flex-direction: column; gap: 6px; padding-top: 3px; }
.step-head strong { font-size: 22px; line-height: 1.45; }
.step-head p { font-size: 18px; color: var(--soft); }
.shot { display: block; width: 100%; max-width: 440px; margin: 0 auto; border-radius: 12px; border: 1px solid var(--line); }
.path { margin: 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-weight: 700; font-size: 20px; }
.path li { border: 2px solid var(--ink); border-radius: 8px; padding: 2px 10px; }
.path li.arrow { border: 0; padding: 0; }

.next { display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; font-weight: 900; font-size: 21px; border: 2px solid var(--ink); border-radius: 14px; padding: 16px; }
.done { font-weight: 700; font-size: 21px; padding: 18px 0; border-block: 3px solid var(--ink); }
.small { font-size: 18px; color: var(--soft); }
.trouble { display: flex; flex-direction: column; gap: 14px; padding-top: 28px; border-top: 1px solid var(--line); scroll-margin-top: 12px; }
.trouble ol { margin: 0; padding-left: 26px; display: flex; flex-direction: column; gap: 10px; }

/* 도움 */
.help { border: 3px solid var(--ink); border-radius: 14px; padding: 24px 20px; display: flex; flex-direction: column; gap: 14px; }
.btn { display: flex; justify-content: center; align-items: center; background: var(--ink); color: var(--bg); font-weight: 900; font-size: 21px; min-height: 60px; border-radius: 12px; text-decoration: none; }
.bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; display: flex; align-items: center; justify-content: center; gap: 10px; min-height: var(--bar-h); padding: 0 16px env(safe-area-inset-bottom, 0px); box-sizing: content-box; background: var(--ink); color: var(--bg); text-decoration: none; font-weight: 900; font-size: 20px; }
footer { font-size: 15px; color: var(--soft); }
